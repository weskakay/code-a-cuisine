<header class="bar" [class.bar--dark]="onDark()">
  <a class="bar__mark" routerLink="/" [attr.aria-label]="text().menu.home">
    <img
      class="bar__logo"
      [src]="onDark() ? 'images/logo.svg' : 'images/logo-green.svg'"
      alt=""
      width="142"
      height="48"
    />
  </a>

  <div class="langs" role="group" [attr.aria-label]="text().language.label">
    <button
      type="button"
      class="langs__button"
      [class.is-on]="language() === 'en'"
      [attr.aria-pressed]="language() === 'en'"
      [attr.aria-label]="text().language.en"
      (click)="use('en')"
    >
      EN
    </button>
    <button
      type="button"
      class="langs__button"
      [class.is-on]="language() === 'de'"
      [attr.aria-pressed]="language() === 'de'"
      [attr.aria-label]="text().language.de"
      (click)="use('de')"
    >
      DE
    </button>
  </div>

  @if (back(); as target) {
    <a
      class="bar__back"
      [routerLink]="target"
      [attr.aria-label]="text().menu.back + ' ' + backLabel()"
    >
      <app-icon name="arrow-left" />
      <span class="bar__back-text">{{ backLabel() }}</span>
    </a>
  }
</header>
