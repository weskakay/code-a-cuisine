<div class="loading">
  <app-menu-bar [onDark]="true" />

  <div class="loading__body" role="status" aria-live="polite">
    <picture class="loading__tile">
      <source media="(prefers-reduced-motion: reduce)" srcset="images/loader-still.webp" />
      <img class="loading__image" src="images/loader.webp" alt="" width="436" height="501" />
    </picture>
    <p class="loading__label">
      {{ label()
      }}<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
    </p>
    @if (hint()) {
      <p class="loading__hint">{{ hint() }}</p>
    }
  </div>
</div>
