<div class="invite">
  <p class="invite__text">{{ text().recipe.invite }}</p>
  <a class="invite__link" routerLink="/cookbook">{{ text().recipe.inviteLink }}</a>
</div>

<a class="again" routerLink="/generate" (click)="startNew()">
  {{ text().recipe.generateNew }}
  <app-icon name="arrow-right" />
</a>
