<app-menu-bar [onDark]="true" />

<main class="hero">
  <app-hero-plates />
  <section class="hero__intro">
    <p class="hero__claim">{{ text().home.claim }}</p>
    <h1 class="hero__title">Code à Cuisine</h1>
    <a class="button button--cream" routerLink="/generate" (click)="startNew()">{{
      text().home.start
    }}</a>
  </section>

  <section class="hero__secondary">
    <p class="hero__question">{{ text().home.inspiration }}</p>
    <a class="button button--ghost" routerLink="/cookbook">
      {{ text().home.cookbook }}
      <app-icon name="arrow-right" />
    </a>
  </section>
</main>

<app-site-footer />
