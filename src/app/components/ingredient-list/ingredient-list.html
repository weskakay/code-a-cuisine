@if (ingredients().length === 0) {
  <p class="list__empty">{{ text().generate.empty }}</p>
} @else {
  <ul class="list">
    @for (item of ingredients(); track $index) {
      <li class="list__item" [class.list__item--editing]="editing() === $index">
        <span class="list__amount">{{ item.amount }} {{ text().unitsShort[item.unit] }}</span>
        <span class="list__name">{{ item.name }}</span>
        <button
          type="button"
          class="list__action"
          [attr.aria-label]="text().generate.change + ' ' + item.name"
          (click)="edit($index)"
        >
          <svg class="list__pencil" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 20h4L19.5 8.5a2.8 2.8 0 0 0-4-4L4 16z" />
            <path d="M14.5 6 18 9.5" />
          </svg>
        </button>
        <button
          type="button"
          class="list__action"
          [attr.aria-label]="text().generate.remove + ' ' + item.name"
          (click)="remove($index)"
        >
          &times;
        </button>
      </li>
    }
  </ul>
}
