@switch (name()) {
  @case ('heart') {
    <svg class="icon" [class.icon--filled]="filled()" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12 20.6 4 12.5a4.8 4.8 0 0 1 0-6.8 4.8 4.8 0 0 1 6.8 0l1.2 1.2 1.2-1.2a4.8 4.8 0 0 1 6.8 0 4.8 4.8 0 0 1 0 6.8z"
      />
    </svg>
  }
  @case ('clock') {
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5.3l3.4 2" />
    </svg>
  }
  @case ('hat') {
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6.5 17.5c-1.9-1-3-2.7-3-4.6a4.3 4.3 0 0 1 4.6-4.2A4.2 4.2 0 0 1 12 5.5a4.2 4.2 0 0 1 3.9 3.2 4.3 4.3 0 0 1 4.6 4.2c0 1.9-1.1 3.6-3 4.6" />
      <path d="M6.5 17.5h11v2.2a.8.8 0 0 1-.8.8H7.3a.8.8 0 0 1-.8-.8z" />
    </svg>
  }
  @case ('spoon') {
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7.5 3.5v6a2.2 2.2 0 0 0 4.4 0v-6" />
      <path d="M9.7 11.7v8.8" />
      <path d="M17 3.5c-1.6 1.3-2.4 3-2.4 4.8s.9 2.9 2.4 2.9 2.4-1.1 2.4-2.9-.8-3.5-2.4-4.8z" />
      <path d="M17 11.2v9.3" />
    </svg>
  }
}
