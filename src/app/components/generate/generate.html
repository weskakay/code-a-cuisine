<app-menu-bar back="/" [backLabel]="text().titles.home" />

<main class="step">
  <header class="step__intro">
    <h1 class="step__title">{{ text().titles.generate }}</h1>
    <p class="step__lead">
      {{ text().generate.lead }}
    </p>
  </header>

  @if (!generationOn) {
    <p class="step__notice">
      {{ text().preferences.localOnly }}
      <a routerLink="/cookbook">{{ text().preferences.localOnlyLink }}</a>
    </p>
  }

  <div class="step__columns">
    <section class="card" aria-labelledby="ingredient-form-title">
      <h2 id="ingredient-form-title" class="card__title">{{ text().generate.addCard }}</h2>
      <app-ingredient-form />
    </section>

    <section class="card card--list" aria-labelledby="ingredient-list-title">
      <h2 id="ingredient-list-title" class="card__title">{{ text().generate.listCard }}</h2>
      <app-ingredient-list />
    </section>
  </div>

  @if (ready()) {
    <a class="step__next" routerLink="/preferences">{{ text().generate.next }}</a>
  }
</main>

<app-site-footer />
